<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stardence Hack Club - Meu projeto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="esquerda">

<div class="caixa-cronometro arrastavel" draggble="true">
<h3>Stopwatch</h3>
<div id="tempo">00:00:00</div>
<button id="btn1" onclick="iniciar()">Start</button>
<button id="btn2" onclick="parar()">Stop</button>
<button id="btn3" onclick="limpar()">Reset</button>
</div>

<div class="caixa-calendario arrastavel" draggable="true">
    <h3>Calendar</h3>
    <div id="mostrar-calendario"></div>
</div>

<div class="caixa-notas arrastavel" draggable="true">
    <h3>Notes</h3>
    <textarea id="texto-notas"></textarea>
    <button onclick="salvarNotas()">Save</button>
</div>

</div>

<div class="centro">
    <h1 class="titulo">STARDENCE HACK CLUB</h1>

    <div class="triangulo"></div>

    <div class="busca">
    <input type="text" id="campo-busca" placeholder="Search...">
    <button onclick="buscar()">Search</button>

    <div class="links" id="div-links">
        <a href="https://google.com" target="_blank">Google</a>
        <a href="https://youtube.com" target="_blank">Youtube</a>
        <a href="https://github.com" target="_blank">Meu Github</a>
    </div>
    </div>
</div>

<div class="direita">

<div class="caixa-jogo arrastavel" draggable="true">
 <h3>Triangle Game</h3>
 <button onclick="alternarJogo()">Open Game</button>

 <div id="tela-do-jogo">
     <div id="pontos">Score: 0</div>
     <div id="boneco"></div>
     <div class="chao"></div>
 </div>

</div>

</div>

<script src="index.js"></script>

</body>
</html>
